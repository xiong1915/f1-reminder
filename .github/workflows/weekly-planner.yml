name: F1 Weekly Planner

on:
  schedule:
    # 每周日北京时间12:07，规划随后8天
    - cron: '7 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f1-weekly-planner
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_catchup: ${{ steps.plan-step.outputs.has_catchup }}
    steps:
      - name: Check scheduler token
        env:
          SCHEDULE_TOKEN: ${{ secrets.SCHEDULE_TOKEN }}
        run: |
          if [ -z "$SCHEDULE_TOKEN" ]; then
            echo "::error::请配置仅限本仓库的 SCHEDULE_TOKEN，Contents 和 Workflows 权限均需 Read and write"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.SCHEDULE_TOKEN }}
      - name: Plan next eight days
        id: plan-step
        run: node weekly-planner.js
      - name: Save plan and exact reminder times
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add weekly-plan.json .github/workflows/f1-reminder.yml
          if ! git diff --staged --quiet; then
            git commit -m "chore: plan weekly F1 reminders"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" -lt 3 ]; then
                git pull --rebase origin main
              fi
            done
            echo "::error::计划未成功保存，现有远端计划仍保留"
            exit 1
          fi

  catchup-reminder:
    needs: plan
    if: needs.plan.outputs.has_catchup == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 关键防线：补发推送必须与 f1-reminder 工作流共享同一个互斥并发组，杜绝并发读取旧历史与重复推送
    concurrency:
      group: f1-reminder-execution
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.SCHEDULE_TOKEN }}
      - name: Send catch-up reminder
        env:
          WEEKLY_PLAN: 'true'
          SCHEDULE_CRON: ''
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          PUSHPLUS_CHANNEL: ${{ secrets.PUSHPLUS_CHANNEL || 'wechat' }}
        run: |
          node reminder.js
      - name: Save updated history
        if: always()
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          if [ -f history.json ]; then
            git add history.json
            if ! git diff --staged --quiet; then
              git commit -m "chore: persist catch-up reminder history [skip ci]"
              PUSH_SUCCESS=false
              for attempt in 1 2 3; do
                if git push origin HEAD:main; then
                  PUSH_SUCCESS=true
                  break
                fi
                if [ "$attempt" -lt 3 ]; then
                  git pull --rebase origin main
                fi
              done
              if [ "$PUSH_SUCCESS" != "true" ]; then
                echo "::error::catch-up 历史记录推送失败，已达最大重试次数"
                exit 1
              fi
            fi
          fi
