name: F1 Race 30-Min Reminder

on:
  schedule:
    # 严格配合开赛前 30 分钟窗口（20~35 分钟），每 10 分钟云端自动检查一次 (UTC)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 支持在 GitHub 网页上手动点击立即测试

permissions:
  contents: write

jobs:
  check-and-remind:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run F1 Reminder Check
        env:
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
          PUSHPLUS_CHANNEL: ${{ secrets.PUSHPLUS_CHANNEL || 'wechat' }}
        run: |
          node reminder.js

      - name: Save sent history to repository
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -f history.json ]; then
            git add history.json
            git diff --staged --quiet || (git commit -m "chore: update reminder history [skip ci]" && git push)
          fi
