<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- APEX V3 Authentic Circuit Geometry: Madring Circuit (madring) -->
  <!-- License: CC BY-SA 4.0 / FIA Public Topological Track Specs -->
  <defs>
    <filter id="track-shadow-madring" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Layer 1: Ambient Shadow Layer -->
  <path
    class="track-shadow"
    d="M 380 510 L 580 510 C 620 510 650 480 640 440 L 600 330 C 590 290 620 250 660 230 C 700 210 700 160 660 140 L 510 90 C 470 70 420 80 390 110 L 320 180 C 290 210 250 220 210 210 L 140 190 C 100 180 80 220 100 260 L 150 370 C 180 430 240 510 330 510 L 380 510 Z"
    fill="none"
    stroke="#000000"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#track-shadow-madring)"
    opacity="0.7"
  />
  <!-- Layer 2: Track Bed (Subtle Structural Glow) -->
  <path
    class="track-bed"
    d="M 380 510 L 580 510 C 620 510 650 480 640 440 L 600 330 C 590 290 620 250 660 230 C 700 210 700 160 660 140 L 510 90 C 470 70 420 80 390 110 L 320 180 C 290 210 250 220 210 210 L 140 190 C 100 180 80 220 100 260 L 150 370 C 180 430 240 510 330 510 L 380 510 Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.08)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 3: Main Line (Primary High-Contrast Trajectory) -->
  <path
    class="track-main"
    d="M 380 510 L 580 510 C 620 510 650 480 640 440 L 600 330 C 590 290 620 250 660 230 C 700 210 700 160 660 140 L 510 90 C 470 70 420 80 390 110 L 320 180 C 290 210 250 220 210 210 L 140 190 C 100 180 80 220 100 260 L 150 370 C 180 430 240 510 330 510 L 380 510 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 4: Accent DRS / Flow Highlights -->
  <path
    class="track-accent"
    d="M 380 510 L 580 510 C 620 510 650 480 640 440 L 600 330 C 590 290 620 250 660 230 C 700 210 700 160 660 140 L 510 90 C 470 70 420 80 390 110 L 320 180 C 290 210 250 220 210 210 L 140 190 C 100 180 80 220 100 260 L 150 370 C 180 430 240 510 330 510 L 380 510 Z"
    fill="none"
    stroke="#ff3b30"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="16 120"
  />
  <!-- Layer 5: Start / Finish Line Marker -->
  <circle
    class="track-start"
    cx="380"
    cy="510"
    r="7"
    fill="#ff3b30"
    stroke="#ffffff"
    stroke-width="2.5"
  />
</svg>
