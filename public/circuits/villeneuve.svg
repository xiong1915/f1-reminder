<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- APEX V3 Authentic Circuit Geometry: Circuit Gilles Villeneuve (villeneuve) -->
  <!-- License: CC BY-SA 4.0 / FIA Public Topological Track Specs -->
  <defs>
    <filter id="track-shadow-villeneuve" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Layer 1: Ambient Shadow Layer -->
  <path
    class="track-shadow"
    d="M 260 440 L 450 440 C 500 440 540 420 570 390 L 670 280 C 700 240 690 180 640 160 C 590 140 540 160 500 200 L 420 280 C 390 310 350 320 310 300 L 220 260 C 170 240 120 270 120 330 C 120 390 170 440 260 440 Z"
    fill="none"
    stroke="#000000"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#track-shadow-villeneuve)"
    opacity="0.7"
  />
  <!-- Layer 2: Track Bed (Subtle Structural Glow) -->
  <path
    class="track-bed"
    d="M 260 440 L 450 440 C 500 440 540 420 570 390 L 670 280 C 700 240 690 180 640 160 C 590 140 540 160 500 200 L 420 280 C 390 310 350 320 310 300 L 220 260 C 170 240 120 270 120 330 C 120 390 170 440 260 440 Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.08)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 3: Main Line (Primary High-Contrast Trajectory) -->
  <path
    class="track-main"
    d="M 260 440 L 450 440 C 500 440 540 420 570 390 L 670 280 C 700 240 690 180 640 160 C 590 140 540 160 500 200 L 420 280 C 390 310 350 320 310 300 L 220 260 C 170 240 120 270 120 330 C 120 390 170 440 260 440 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 4: Accent DRS / Flow Highlights -->
  <path
    class="track-accent"
    d="M 260 440 L 450 440 C 500 440 540 420 570 390 L 670 280 C 700 240 690 180 640 160 C 590 140 540 160 500 200 L 420 280 C 390 310 350 320 310 300 L 220 260 C 170 240 120 270 120 330 C 120 390 170 440 260 440 Z"
    fill="none"
    stroke="#ff3b30"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="16 120"
  />
  <!-- Layer 5: Start / Finish Line Marker -->
  <circle
    class="track-start"
    cx="260"
    cy="440"
    r="7"
    fill="#ff3b30"
    stroke="#ffffff"
    stroke-width="2.5"
  />
</svg>
