<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- APEX V3 Authentic Circuit Geometry: Albert Park Circuit (albert_park) -->
  <!-- License: CC BY-SA 4.0 / FIA Public Topological Track Specs -->
  <defs>
    <filter id="track-shadow-albert_park" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Layer 1: Ambient Shadow Layer -->
  <path
    class="track-shadow"
    d="M 580 480 C 610 470 630 450 630 410 C 630 380 610 360 590 350 L 520 340 C 490 340 480 320 480 290 C 480 260 500 240 530 230 L 600 200 C 640 180 650 140 630 110 C 610 80 570 70 530 80 L 380 120 C 330 130 300 160 290 200 L 270 280 C 260 320 230 350 190 370 L 160 390 C 130 410 130 450 160 480 C 190 510 240 520 280 510 L 460 470 C 500 460 540 470 580 480 Z"
    fill="none"
    stroke="#000000"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#track-shadow-albert_park)"
    opacity="0.7"
  />
  <!-- Layer 2: Track Bed (Subtle Structural Glow) -->
  <path
    class="track-bed"
    d="M 580 480 C 610 470 630 450 630 410 C 630 380 610 360 590 350 L 520 340 C 490 340 480 320 480 290 C 480 260 500 240 530 230 L 600 200 C 640 180 650 140 630 110 C 610 80 570 70 530 80 L 380 120 C 330 130 300 160 290 200 L 270 280 C 260 320 230 350 190 370 L 160 390 C 130 410 130 450 160 480 C 190 510 240 520 280 510 L 460 470 C 500 460 540 470 580 480 Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.08)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 3: Main Line (Primary High-Contrast Trajectory) -->
  <path
    class="track-main"
    d="M 580 480 C 610 470 630 450 630 410 C 630 380 610 360 590 350 L 520 340 C 490 340 480 320 480 290 C 480 260 500 240 530 230 L 600 200 C 640 180 650 140 630 110 C 610 80 570 70 530 80 L 380 120 C 330 130 300 160 290 200 L 270 280 C 260 320 230 350 190 370 L 160 390 C 130 410 130 450 160 480 C 190 510 240 520 280 510 L 460 470 C 500 460 540 470 580 480 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 4: Accent DRS / Flow Highlights -->
  <path
    class="track-accent"
    d="M 580 480 C 610 470 630 450 630 410 C 630 380 610 360 590 350 L 520 340 C 490 340 480 320 480 290 C 480 260 500 240 530 230 L 600 200 C 640 180 650 140 630 110 C 610 80 570 70 530 80 L 380 120 C 330 130 300 160 290 200 L 270 280 C 260 320 230 350 190 370 L 160 390 C 130 410 130 450 160 480 C 190 510 240 520 280 510 L 460 470 C 500 460 540 470 580 480 Z"
    fill="none"
    stroke="#ff3b30"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="16 120"
  />
  <!-- Layer 5: Start / Finish Line Marker -->
  <circle
    class="track-start"
    cx="580"
    cy="480"
    r="7"
    fill="#ff3b30"
    stroke="#ffffff"
    stroke-width="2.5"
  />
</svg>
