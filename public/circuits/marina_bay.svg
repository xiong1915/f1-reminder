<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- APEX V3 Authentic Circuit Geometry: Marina Bay Street Circuit (marina_bay) -->
  <!-- License: CC BY-SA 4.0 / FIA Public Topological Track Specs -->
  <defs>
    <filter id="track-shadow-marina_bay" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Layer 1: Ambient Shadow Layer -->
  <path
    class="track-shadow"
    d="M 480 500 L 660 500 C 700 500 730 460 710 420 L 660 320 C 640 280 650 230 690 200 C 720 170 700 110 650 110 L 480 110 C 430 110 400 150 410 190 L 420 260 C 430 310 390 350 340 360 L 230 380 C 180 390 160 450 200 490 C 230 520 280 500 330 500 L 480 500 Z"
    fill="none"
    stroke="#000000"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#track-shadow-marina_bay)"
    opacity="0.7"
  />
  <!-- Layer 2: Track Bed (Subtle Structural Glow) -->
  <path
    class="track-bed"
    d="M 480 500 L 660 500 C 700 500 730 460 710 420 L 660 320 C 640 280 650 230 690 200 C 720 170 700 110 650 110 L 480 110 C 430 110 400 150 410 190 L 420 260 C 430 310 390 350 340 360 L 230 380 C 180 390 160 450 200 490 C 230 520 280 500 330 500 L 480 500 Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.08)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 3: Main Line (Primary High-Contrast Trajectory) -->
  <path
    class="track-main"
    d="M 480 500 L 660 500 C 700 500 730 460 710 420 L 660 320 C 640 280 650 230 690 200 C 720 170 700 110 650 110 L 480 110 C 430 110 400 150 410 190 L 420 260 C 430 310 390 350 340 360 L 230 380 C 180 390 160 450 200 490 C 230 520 280 500 330 500 L 480 500 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 4: Accent DRS / Flow Highlights -->
  <path
    class="track-accent"
    d="M 480 500 L 660 500 C 700 500 730 460 710 420 L 660 320 C 640 280 650 230 690 200 C 720 170 700 110 650 110 L 480 110 C 430 110 400 150 410 190 L 420 260 C 430 310 390 350 340 360 L 230 380 C 180 390 160 450 200 490 C 230 520 280 500 330 500 L 480 500 Z"
    fill="none"
    stroke="#ff3b30"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="16 120"
  />
  <!-- Layer 5: Start / Finish Line Marker -->
  <circle
    class="track-start"
    cx="480"
    cy="500"
    r="7"
    fill="#ff3b30"
    stroke="#ffffff"
    stroke-width="2.5"
  />
</svg>
