<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- APEX V3 Authentic Circuit Geometry: Autodromo Nazionale Monza (monza) -->
  <!-- License: CC BY-SA 4.0 / FIA Public Topological Track Specs -->
  <defs>
    <filter id="track-shadow-monza" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Layer 1: Ambient Shadow Layer -->
  <path
    class="track-shadow"
    d="M 340 500 L 620 500 C 670 500 700 460 690 410 L 660 270 C 650 210 610 160 550 150 L 450 140 C 400 140 370 110 380 70 C 390 30 350 20 320 30 L 250 60 C 200 80 180 130 200 180 L 230 260 C 250 320 220 380 160 410 C 110 430 120 500 180 500 L 340 500 Z"
    fill="none"
    stroke="#000000"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#track-shadow-monza)"
    opacity="0.7"
  />
  <!-- Layer 2: Track Bed (Subtle Structural Glow) -->
  <path
    class="track-bed"
    d="M 340 500 L 620 500 C 670 500 700 460 690 410 L 660 270 C 650 210 610 160 550 150 L 450 140 C 400 140 370 110 380 70 C 390 30 350 20 320 30 L 250 60 C 200 80 180 130 200 180 L 230 260 C 250 320 220 380 160 410 C 110 430 120 500 180 500 L 340 500 Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.08)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 3: Main Line (Primary High-Contrast Trajectory) -->
  <path
    class="track-main"
    d="M 340 500 L 620 500 C 670 500 700 460 690 410 L 660 270 C 650 210 610 160 550 150 L 450 140 C 400 140 370 110 380 70 C 390 30 350 20 320 30 L 250 60 C 200 80 180 130 200 180 L 230 260 C 250 320 220 380 160 410 C 110 430 120 500 180 500 L 340 500 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 4: Accent DRS / Flow Highlights -->
  <path
    class="track-accent"
    d="M 340 500 L 620 500 C 670 500 700 460 690 410 L 660 270 C 650 210 610 160 550 150 L 450 140 C 400 140 370 110 380 70 C 390 30 350 20 320 30 L 250 60 C 200 80 180 130 200 180 L 230 260 C 250 320 220 380 160 410 C 110 430 120 500 180 500 L 340 500 Z"
    fill="none"
    stroke="#ff3b30"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="16 120"
  />
  <!-- Layer 5: Start / Finish Line Marker -->
  <circle
    class="track-start"
    cx="340"
    cy="500"
    r="7"
    fill="#ff3b30"
    stroke="#ffffff"
    stroke-width="2.5"
  />
</svg>
