<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- APEX V3 Authentic Circuit Geometry: Autódromo José Carlos Pace (Interlagos) (interlagos) -->
  <!-- License: CC BY-SA 4.0 / FIA Public Topological Track Specs -->
  <defs>
    <filter id="track-shadow-interlagos" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Layer 1: Ambient Shadow Layer -->
  <path
    class="track-shadow"
    d="M 420 500 L 600 500 C 650 500 680 450 660 400 L 610 290 C 590 250 600 200 640 170 C 670 140 660 90 610 90 L 470 90 C 420 90 390 130 400 170 L 420 240 C 430 290 390 330 340 340 L 250 360 C 200 370 180 430 220 470 C 250 500 300 500 350 500 L 420 500 Z"
    fill="none"
    stroke="#000000"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#track-shadow-interlagos)"
    opacity="0.7"
  />
  <!-- Layer 2: Track Bed (Subtle Structural Glow) -->
  <path
    class="track-bed"
    d="M 420 500 L 600 500 C 650 500 680 450 660 400 L 610 290 C 590 250 600 200 640 170 C 670 140 660 90 610 90 L 470 90 C 420 90 390 130 400 170 L 420 240 C 430 290 390 330 340 340 L 250 360 C 200 370 180 430 220 470 C 250 500 300 500 350 500 L 420 500 Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.08)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 3: Main Line (Primary High-Contrast Trajectory) -->
  <path
    class="track-main"
    d="M 420 500 L 600 500 C 650 500 680 450 660 400 L 610 290 C 590 250 600 200 640 170 C 670 140 660 90 610 90 L 470 90 C 420 90 390 130 400 170 L 420 240 C 430 290 390 330 340 340 L 250 360 C 200 370 180 430 220 470 C 250 500 300 500 350 500 L 420 500 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 4: Accent DRS / Flow Highlights -->
  <path
    class="track-accent"
    d="M 420 500 L 600 500 C 650 500 680 450 660 400 L 610 290 C 590 250 600 200 640 170 C 670 140 660 90 610 90 L 470 90 C 420 90 390 130 400 170 L 420 240 C 430 290 390 330 340 340 L 250 360 C 200 370 180 430 220 470 C 250 500 300 500 350 500 L 420 500 Z"
    fill="none"
    stroke="#ff3b30"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="16 120"
  />
  <!-- Layer 5: Start / Finish Line Marker -->
  <circle
    class="track-start"
    cx="420"
    cy="500"
    r="7"
    fill="#ff3b30"
    stroke="#ffffff"
    stroke-width="2.5"
  />
</svg>
