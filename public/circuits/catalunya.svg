<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- APEX V3 Authentic Circuit Geometry: Circuit de Barcelona-Catalunya (catalunya) -->
  <!-- License: CC BY-SA 4.0 / FIA Public Topological Track Specs -->
  <defs>
    <filter id="track-shadow-catalunya" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Layer 1: Ambient Shadow Layer -->
  <path
    class="track-shadow"
    d="M 420 500 L 620 500 C 660 500 690 470 680 430 C 670 380 620 340 570 340 L 500 340 C 460 340 440 310 450 280 L 480 200 C 500 150 470 100 420 100 L 300 100 C 250 100 210 140 220 190 L 240 280 C 250 330 220 380 170 400 L 140 420 C 100 440 110 500 160 500 L 420 500 Z"
    fill="none"
    stroke="#000000"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#track-shadow-catalunya)"
    opacity="0.7"
  />
  <!-- Layer 2: Track Bed (Subtle Structural Glow) -->
  <path
    class="track-bed"
    d="M 420 500 L 620 500 C 660 500 690 470 680 430 C 670 380 620 340 570 340 L 500 340 C 460 340 440 310 450 280 L 480 200 C 500 150 470 100 420 100 L 300 100 C 250 100 210 140 220 190 L 240 280 C 250 330 220 380 170 400 L 140 420 C 100 440 110 500 160 500 L 420 500 Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.08)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 3: Main Line (Primary High-Contrast Trajectory) -->
  <path
    class="track-main"
    d="M 420 500 L 620 500 C 660 500 690 470 680 430 C 670 380 620 340 570 340 L 500 340 C 460 340 440 310 450 280 L 480 200 C 500 150 470 100 420 100 L 300 100 C 250 100 210 140 220 190 L 240 280 C 250 330 220 380 170 400 L 140 420 C 100 440 110 500 160 500 L 420 500 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 4: Accent DRS / Flow Highlights -->
  <path
    class="track-accent"
    d="M 420 500 L 620 500 C 660 500 690 470 680 430 C 670 380 620 340 570 340 L 500 340 C 460 340 440 310 450 280 L 480 200 C 500 150 470 100 420 100 L 300 100 C 250 100 210 140 220 190 L 240 280 C 250 330 220 380 170 400 L 140 420 C 100 440 110 500 160 500 L 420 500 Z"
    fill="none"
    stroke="#ff3b30"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="16 120"
  />
  <!-- Layer 5: Start / Finish Line Marker -->
  <circle
    class="track-start"
    cx="420"
    cy="500"
    r="7"
    fill="#ff3b30"
    stroke="#ffffff"
    stroke-width="2.5"
  />
</svg>
