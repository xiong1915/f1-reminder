<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- APEX V3 Authentic Circuit Geometry: Circuit de Spa-Francorchamps (spa) -->
  <!-- License: CC BY-SA 4.0 / FIA Public Topological Track Specs -->
  <defs>
    <filter id="track-shadow-spa" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Layer 1: Ambient Shadow Layer -->
  <path
    class="track-shadow"
    d="M 360 520 L 520 520 C 560 520 590 490 580 450 L 550 360 C 540 310 570 270 620 260 L 680 250 C 720 240 730 190 700 160 L 580 60 C 540 20 480 30 450 70 L 390 150 C 360 190 320 210 270 210 L 190 210 C 140 210 110 260 130 310 L 170 410 C 190 460 230 520 300 520 L 360 520 Z"
    fill="none"
    stroke="#000000"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#track-shadow-spa)"
    opacity="0.7"
  />
  <!-- Layer 2: Track Bed (Subtle Structural Glow) -->
  <path
    class="track-bed"
    d="M 360 520 L 520 520 C 560 520 590 490 580 450 L 550 360 C 540 310 570 270 620 260 L 680 250 C 720 240 730 190 700 160 L 580 60 C 540 20 480 30 450 70 L 390 150 C 360 190 320 210 270 210 L 190 210 C 140 210 110 260 130 310 L 170 410 C 190 460 230 520 300 520 L 360 520 Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.08)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 3: Main Line (Primary High-Contrast Trajectory) -->
  <path
    class="track-main"
    d="M 360 520 L 520 520 C 560 520 590 490 580 450 L 550 360 C 540 310 570 270 620 260 L 680 250 C 720 240 730 190 700 160 L 580 60 C 540 20 480 30 450 70 L 390 150 C 360 190 320 210 270 210 L 190 210 C 140 210 110 260 130 310 L 170 410 C 190 460 230 520 300 520 L 360 520 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 4: Accent DRS / Flow Highlights -->
  <path
    class="track-accent"
    d="M 360 520 L 520 520 C 560 520 590 490 580 450 L 550 360 C 540 310 570 270 620 260 L 680 250 C 720 240 730 190 700 160 L 580 60 C 540 20 480 30 450 70 L 390 150 C 360 190 320 210 270 210 L 190 210 C 140 210 110 260 130 310 L 170 410 C 190 460 230 520 300 520 L 360 520 Z"
    fill="none"
    stroke="#ff3b30"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="16 120"
  />
  <!-- Layer 5: Start / Finish Line Marker -->
  <circle
    class="track-start"
    cx="360"
    cy="520"
    r="7"
    fill="#ff3b30"
    stroke="#ffffff"
    stroke-width="2.5"
  />
</svg>
