<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- APEX V3 Authentic Circuit Geometry: Circuit of the Americas (americas) -->
  <!-- License: CC BY-SA 4.0 / FIA Public Topological Track Specs -->
  <defs>
    <filter id="track-shadow-americas" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Layer 1: Ambient Shadow Layer -->
  <path
    class="track-shadow"
    d="M 360 520 L 560 520 C 600 520 630 480 620 440 L 590 330 C 580 280 610 240 660 230 C 700 220 720 170 690 140 L 560 60 C 520 30 460 40 430 80 L 370 160 C 340 200 300 220 250 220 L 170 220 C 120 220 100 270 120 320 L 160 420 C 180 470 220 520 290 520 L 360 520 Z"
    fill="none"
    stroke="#000000"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#track-shadow-americas)"
    opacity="0.7"
  />
  <!-- Layer 2: Track Bed (Subtle Structural Glow) -->
  <path
    class="track-bed"
    d="M 360 520 L 560 520 C 600 520 630 480 620 440 L 590 330 C 580 280 610 240 660 230 C 700 220 720 170 690 140 L 560 60 C 520 30 460 40 430 80 L 370 160 C 340 200 300 220 250 220 L 170 220 C 120 220 100 270 120 320 L 160 420 C 180 470 220 520 290 520 L 360 520 Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.08)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 3: Main Line (Primary High-Contrast Trajectory) -->
  <path
    class="track-main"
    d="M 360 520 L 560 520 C 600 520 630 480 620 440 L 590 330 C 580 280 610 240 660 230 C 700 220 720 170 690 140 L 560 60 C 520 30 460 40 430 80 L 370 160 C 340 200 300 220 250 220 L 170 220 C 120 220 100 270 120 320 L 160 420 C 180 470 220 520 290 520 L 360 520 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 4: Accent DRS / Flow Highlights -->
  <path
    class="track-accent"
    d="M 360 520 L 560 520 C 600 520 630 480 620 440 L 590 330 C 580 280 610 240 660 230 C 700 220 720 170 690 140 L 560 60 C 520 30 460 40 430 80 L 370 160 C 340 200 300 220 250 220 L 170 220 C 120 220 100 270 120 320 L 160 420 C 180 470 220 520 290 520 L 360 520 Z"
    fill="none"
    stroke="#ff3b30"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="16 120"
  />
  <!-- Layer 5: Start / Finish Line Marker -->
  <circle
    class="track-start"
    cx="360"
    cy="520"
    r="7"
    fill="#ff3b30"
    stroke="#ffffff"
    stroke-width="2.5"
  />
</svg>
