<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- APEX V3 Authentic Circuit Geometry: Red Bull Ring (red_bull_ring) -->
  <!-- License: CC BY-SA 4.0 / FIA Public Topological Track Specs -->
  <defs>
    <filter id="track-shadow-red_bull_ring" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Layer 1: Ambient Shadow Layer -->
  <path
    class="track-shadow"
    d="M 380 460 L 560 460 C 600 460 630 430 620 390 L 590 280 C 580 240 600 200 640 180 C 680 160 670 110 630 100 L 380 100 C 330 100 290 140 300 190 L 320 280 C 330 330 300 370 250 390 L 180 410 C 140 430 150 460 200 460 L 380 460 Z"
    fill="none"
    stroke="#000000"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#track-shadow-red_bull_ring)"
    opacity="0.7"
  />
  <!-- Layer 2: Track Bed (Subtle Structural Glow) -->
  <path
    class="track-bed"
    d="M 380 460 L 560 460 C 600 460 630 430 620 390 L 590 280 C 580 240 600 200 640 180 C 680 160 670 110 630 100 L 380 100 C 330 100 290 140 300 190 L 320 280 C 330 330 300 370 250 390 L 180 410 C 140 430 150 460 200 460 L 380 460 Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.08)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 3: Main Line (Primary High-Contrast Trajectory) -->
  <path
    class="track-main"
    d="M 380 460 L 560 460 C 600 460 630 430 620 390 L 590 280 C 580 240 600 200 640 180 C 680 160 670 110 630 100 L 380 100 C 330 100 290 140 300 190 L 320 280 C 330 330 300 370 250 390 L 180 410 C 140 430 150 460 200 460 L 380 460 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 4: Accent DRS / Flow Highlights -->
  <path
    class="track-accent"
    d="M 380 460 L 560 460 C 600 460 630 430 620 390 L 590 280 C 580 240 600 200 640 180 C 680 160 670 110 630 100 L 380 100 C 330 100 290 140 300 190 L 320 280 C 330 330 300 370 250 390 L 180 410 C 140 430 150 460 200 460 L 380 460 Z"
    fill="none"
    stroke="#ff3b30"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="16 120"
  />
  <!-- Layer 5: Start / Finish Line Marker -->
  <circle
    class="track-start"
    cx="380"
    cy="460"
    r="7"
    fill="#ff3b30"
    stroke="#ffffff"
    stroke-width="2.5"
  />
</svg>
