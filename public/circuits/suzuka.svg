<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- APEX V3 Authentic Circuit Geometry: Suzuka International Racing Course (suzuka) -->
  <!-- License: CC BY-SA 4.0 / FIA Public Topological Track Specs -->
  <defs>
    <filter id="track-shadow-suzuka" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Layer 1: Ambient Shadow Layer -->
  <path
    class="track-shadow"
    d="M 500 460 L 580 460 C 620 460 640 430 630 400 L 580 340 C 560 320 560 290 590 270 C 620 250 640 220 620 190 C 600 160 570 160 550 180 L 500 230 C 470 260 430 260 410 230 L 360 160 C 340 130 310 120 280 140 C 250 160 240 200 260 230 L 340 330 C 370 370 360 410 320 440 L 230 480 C 180 500 140 470 140 420 C 140 370 180 340 220 330 L 390 310 C 430 310 470 350 470 390 L 470 440 C 470 460 480 460 500 460 Z"
    fill="none"
    stroke="#000000"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#track-shadow-suzuka)"
    opacity="0.7"
  />
  <!-- Layer 2: Track Bed (Subtle Structural Glow) -->
  <path
    class="track-bed"
    d="M 500 460 L 580 460 C 620 460 640 430 630 400 L 580 340 C 560 320 560 290 590 270 C 620 250 640 220 620 190 C 600 160 570 160 550 180 L 500 230 C 470 260 430 260 410 230 L 360 160 C 340 130 310 120 280 140 C 250 160 240 200 260 230 L 340 330 C 370 370 360 410 320 440 L 230 480 C 180 500 140 470 140 420 C 140 370 180 340 220 330 L 390 310 C 430 310 470 350 470 390 L 470 440 C 470 460 480 460 500 460 Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.08)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 3: Main Line (Primary High-Contrast Trajectory) -->
  <path
    class="track-main"
    d="M 500 460 L 580 460 C 620 460 640 430 630 400 L 580 340 C 560 320 560 290 590 270 C 620 250 640 220 620 190 C 600 160 570 160 550 180 L 500 230 C 470 260 430 260 410 230 L 360 160 C 340 130 310 120 280 140 C 250 160 240 200 260 230 L 340 330 C 370 370 360 410 320 440 L 230 480 C 180 500 140 470 140 420 C 140 370 180 340 220 330 L 390 310 C 430 310 470 350 470 390 L 470 440 C 470 460 480 460 500 460 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 4: Accent DRS / Flow Highlights -->
  <path
    class="track-accent"
    d="M 500 460 L 580 460 C 620 460 640 430 630 400 L 580 340 C 560 320 560 290 590 270 C 620 250 640 220 620 190 C 600 160 570 160 550 180 L 500 230 C 470 260 430 260 410 230 L 360 160 C 340 130 310 120 280 140 C 250 160 240 200 260 230 L 340 330 C 370 370 360 410 320 440 L 230 480 C 180 500 140 470 140 420 C 140 370 180 340 220 330 L 390 310 C 430 310 470 350 470 390 L 470 440 C 470 460 480 460 500 460 Z"
    fill="none"
    stroke="#ff3b30"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="16 120"
  />
  <!-- Layer 5: Start / Finish Line Marker -->
  <circle
    class="track-start"
    cx="500"
    cy="460"
    r="7"
    fill="#ff3b30"
    stroke="#ffffff"
    stroke-width="2.5"
  />
</svg>
