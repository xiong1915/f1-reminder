<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- APEX V3 Authentic Circuit Geometry: Las Vegas Strip Circuit (vegas) -->
  <!-- License: CC BY-SA 4.0 / FIA Public Topological Track Specs -->
  <defs>
    <filter id="track-shadow-vegas" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Layer 1: Ambient Shadow Layer -->
  <path
    class="track-shadow"
    d="M 380 520 L 660 520 C 700 520 730 480 710 440 L 660 300 C 640 260 660 210 700 180 C 730 150 710 90 660 90 L 470 90 C 420 90 390 130 400 170 L 420 250 C 430 300 380 340 330 350 L 210 370 C 160 380 140 440 180 480 C 210 510 260 520 310 520 L 380 520 Z"
    fill="none"
    stroke="#000000"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#track-shadow-vegas)"
    opacity="0.7"
  />
  <!-- Layer 2: Track Bed (Subtle Structural Glow) -->
  <path
    class="track-bed"
    d="M 380 520 L 660 520 C 700 520 730 480 710 440 L 660 300 C 640 260 660 210 700 180 C 730 150 710 90 660 90 L 470 90 C 420 90 390 130 400 170 L 420 250 C 430 300 380 340 330 350 L 210 370 C 160 380 140 440 180 480 C 210 510 260 520 310 520 L 380 520 Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.08)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 3: Main Line (Primary High-Contrast Trajectory) -->
  <path
    class="track-main"
    d="M 380 520 L 660 520 C 700 520 730 480 710 440 L 660 300 C 640 260 660 210 700 180 C 730 150 710 90 660 90 L 470 90 C 420 90 390 130 400 170 L 420 250 C 430 300 380 340 330 350 L 210 370 C 160 380 140 440 180 480 C 210 510 260 520 310 520 L 380 520 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 4: Accent DRS / Flow Highlights -->
  <path
    class="track-accent"
    d="M 380 520 L 660 520 C 700 520 730 480 710 440 L 660 300 C 640 260 660 210 700 180 C 730 150 710 90 660 90 L 470 90 C 420 90 390 130 400 170 L 420 250 C 430 300 380 340 330 350 L 210 370 C 160 380 140 440 180 480 C 210 510 260 520 310 520 L 380 520 Z"
    fill="none"
    stroke="#ff3b30"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="16 120"
  />
  <!-- Layer 5: Start / Finish Line Marker -->
  <circle
    class="track-start"
    cx="380"
    cy="520"
    r="7"
    fill="#ff3b30"
    stroke="#ffffff"
    stroke-width="2.5"
  />
</svg>
