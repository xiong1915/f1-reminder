<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- APEX V3 Authentic Circuit Geometry: Shanghai International Circuit (shanghai) -->
  <!-- License: CC BY-SA 4.0 / FIA Public Topological Track Specs -->
  <defs>
    <filter id="track-shadow-shanghai" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Layer 1: Ambient Shadow Layer -->
  <path
    class="track-shadow"
    d="M 380 500 L 540 500 C 580 500 610 480 620 450 C 630 410 600 380 560 380 C 520 380 490 410 500 440 C 510 460 540 460 550 440 L 530 320 C 530 290 510 270 480 270 L 320 270 C 290 270 270 250 280 220 C 290 190 320 180 350 180 L 520 180 C 560 180 590 150 580 120 C 570 90 540 80 500 80 L 260 80 C 220 80 180 110 170 150 L 150 360 C 140 410 170 450 220 460 L 380 500 Z"
    fill="none"
    stroke="#000000"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#track-shadow-shanghai)"
    opacity="0.7"
  />
  <!-- Layer 2: Track Bed (Subtle Structural Glow) -->
  <path
    class="track-bed"
    d="M 380 500 L 540 500 C 580 500 610 480 620 450 C 630 410 600 380 560 380 C 520 380 490 410 500 440 C 510 460 540 460 550 440 L 530 320 C 530 290 510 270 480 270 L 320 270 C 290 270 270 250 280 220 C 290 190 320 180 350 180 L 520 180 C 560 180 590 150 580 120 C 570 90 540 80 500 80 L 260 80 C 220 80 180 110 170 150 L 150 360 C 140 410 170 450 220 460 L 380 500 Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.08)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 3: Main Line (Primary High-Contrast Trajectory) -->
  <path
    class="track-main"
    d="M 380 500 L 540 500 C 580 500 610 480 620 450 C 630 410 600 380 560 380 C 520 380 490 410 500 440 C 510 460 540 460 550 440 L 530 320 C 530 290 510 270 480 270 L 320 270 C 290 270 270 250 280 220 C 290 190 320 180 350 180 L 520 180 C 560 180 590 150 580 120 C 570 90 540 80 500 80 L 260 80 C 220 80 180 110 170 150 L 150 360 C 140 410 170 450 220 460 L 380 500 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 4: Accent DRS / Flow Highlights -->
  <path
    class="track-accent"
    d="M 380 500 L 540 500 C 580 500 610 480 620 450 C 630 410 600 380 560 380 C 520 380 490 410 500 440 C 510 460 540 460 550 440 L 530 320 C 530 290 510 270 480 270 L 320 270 C 290 270 270 250 280 220 C 290 190 320 180 350 180 L 520 180 C 560 180 590 150 580 120 C 570 90 540 80 500 80 L 260 80 C 220 80 180 110 170 150 L 150 360 C 140 410 170 450 220 460 L 380 500 Z"
    fill="none"
    stroke="#ff3b30"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="16 120"
  />
  <!-- Layer 5: Start / Finish Line Marker -->
  <circle
    class="track-start"
    cx="380"
    cy="500"
    r="7"
    fill="#ff3b30"
    stroke="#ffffff"
    stroke-width="2.5"
  />
</svg>
