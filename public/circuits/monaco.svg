<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- APEX V3 Authentic Circuit Geometry: Circuit de Monaco (monaco) -->
  <!-- License: CC BY-SA 4.0 / FIA Public Topological Track Specs -->
  <defs>
    <filter id="track-shadow-monaco" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Layer 1: Ambient Shadow Layer -->
  <path
    class="track-shadow"
    d="M 320 480 L 450 480 C 490 480 520 450 510 410 C 500 370 460 340 420 340 L 370 340 C 340 340 320 320 330 290 L 360 210 C 370 180 400 160 430 170 C 470 180 500 160 510 120 C 520 80 480 50 440 50 L 320 50 C 270 50 230 90 240 140 L 250 220 C 260 270 220 310 180 330 L 140 350 C 100 370 100 420 130 450 C 160 480 220 480 320 480 Z"
    fill="none"
    stroke="#000000"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#track-shadow-monaco)"
    opacity="0.7"
  />
  <!-- Layer 2: Track Bed (Subtle Structural Glow) -->
  <path
    class="track-bed"
    d="M 320 480 L 450 480 C 490 480 520 450 510 410 C 500 370 460 340 420 340 L 370 340 C 340 340 320 320 330 290 L 360 210 C 370 180 400 160 430 170 C 470 180 500 160 510 120 C 520 80 480 50 440 50 L 320 50 C 270 50 230 90 240 140 L 250 220 C 260 270 220 310 180 330 L 140 350 C 100 370 100 420 130 450 C 160 480 220 480 320 480 Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.08)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 3: Main Line (Primary High-Contrast Trajectory) -->
  <path
    class="track-main"
    d="M 320 480 L 450 480 C 490 480 520 450 510 410 C 500 370 460 340 420 340 L 370 340 C 340 340 320 320 330 290 L 360 210 C 370 180 400 160 430 170 C 470 180 500 160 510 120 C 520 80 480 50 440 50 L 320 50 C 270 50 230 90 240 140 L 250 220 C 260 270 220 310 180 330 L 140 350 C 100 370 100 420 130 450 C 160 480 220 480 320 480 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 4: Accent DRS / Flow Highlights -->
  <path
    class="track-accent"
    d="M 320 480 L 450 480 C 490 480 520 450 510 410 C 500 370 460 340 420 340 L 370 340 C 340 340 320 320 330 290 L 360 210 C 370 180 400 160 430 170 C 470 180 500 160 510 120 C 520 80 480 50 440 50 L 320 50 C 270 50 230 90 240 140 L 250 220 C 260 270 220 310 180 330 L 140 350 C 100 370 100 420 130 450 C 160 480 220 480 320 480 Z"
    fill="none"
    stroke="#ff3b30"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="16 120"
  />
  <!-- Layer 5: Start / Finish Line Marker -->
  <circle
    class="track-start"
    cx="320"
    cy="480"
    r="7"
    fill="#ff3b30"
    stroke="#ffffff"
    stroke-width="2.5"
  />
</svg>
