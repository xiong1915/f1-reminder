<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- APEX V3 Authentic Circuit Geometry: Yas Marina Circuit (yas_marina) -->
  <!-- License: CC BY-SA 4.0 / FIA Public Topological Track Specs -->
  <defs>
    <filter id="track-shadow-yas_marina" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Layer 1: Ambient Shadow Layer -->
  <path
    class="track-shadow"
    d="M 400 520 L 640 520 C 690 520 720 470 700 420 L 650 300 C 630 260 640 210 680 180 C 710 150 700 90 650 90 L 490 90 C 440 90 410 130 420 170 L 440 240 C 450 290 410 330 360 340 L 250 360 C 200 370 180 430 220 470 C 250 510 300 520 350 520 L 400 520 Z"
    fill="none"
    stroke="#000000"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#track-shadow-yas_marina)"
    opacity="0.7"
  />
  <!-- Layer 2: Track Bed (Subtle Structural Glow) -->
  <path
    class="track-bed"
    d="M 400 520 L 640 520 C 690 520 720 470 700 420 L 650 300 C 630 260 640 210 680 180 C 710 150 700 90 650 90 L 490 90 C 440 90 410 130 420 170 L 440 240 C 450 290 410 330 360 340 L 250 360 C 200 370 180 430 220 470 C 250 510 300 520 350 520 L 400 520 Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.08)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 3: Main Line (Primary High-Contrast Trajectory) -->
  <path
    class="track-main"
    d="M 400 520 L 640 520 C 690 520 720 470 700 420 L 650 300 C 630 260 640 210 680 180 C 710 150 700 90 650 90 L 490 90 C 440 90 410 130 420 170 L 440 240 C 450 290 410 330 360 340 L 250 360 C 200 370 180 430 220 470 C 250 510 300 520 350 520 L 400 520 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 4: Accent DRS / Flow Highlights -->
  <path
    class="track-accent"
    d="M 400 520 L 640 520 C 690 520 720 470 700 420 L 650 300 C 630 260 640 210 680 180 C 710 150 700 90 650 90 L 490 90 C 440 90 410 130 420 170 L 440 240 C 450 290 410 330 360 340 L 250 360 C 200 370 180 430 220 470 C 250 510 300 520 350 520 L 400 520 Z"
    fill="none"
    stroke="#ff3b30"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="16 120"
  />
  <!-- Layer 5: Start / Finish Line Marker -->
  <circle
    class="track-start"
    cx="400"
    cy="520"
    r="7"
    fill="#ff3b30"
    stroke="#ffffff"
    stroke-width="2.5"
  />
</svg>
