<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- APEX V3 Authentic Circuit Geometry: Autódromo Hermanos Rodríguez (rodriguez) -->
  <!-- License: CC BY-SA 4.0 / FIA Public Topological Track Specs -->
  <defs>
    <filter id="track-shadow-rodriguez" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Layer 1: Ambient Shadow Layer -->
  <path
    class="track-shadow"
    d="M 380 480 L 640 480 C 680 480 710 440 690 400 L 640 290 C 620 250 630 200 670 170 C 700 140 680 90 630 90 L 480 90 C 430 90 400 130 410 170 L 430 240 C 440 290 400 330 350 340 L 240 360 C 190 370 160 420 190 460 C 220 490 270 480 320 480 L 380 480 Z"
    fill="none"
    stroke="#000000"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#track-shadow-rodriguez)"
    opacity="0.7"
  />
  <!-- Layer 2: Track Bed (Subtle Structural Glow) -->
  <path
    class="track-bed"
    d="M 380 480 L 640 480 C 680 480 710 440 690 400 L 640 290 C 620 250 630 200 670 170 C 700 140 680 90 630 90 L 480 90 C 430 90 400 130 410 170 L 430 240 C 440 290 400 330 350 340 L 240 360 C 190 370 160 420 190 460 C 220 490 270 480 320 480 L 380 480 Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.08)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 3: Main Line (Primary High-Contrast Trajectory) -->
  <path
    class="track-main"
    d="M 380 480 L 640 480 C 680 480 710 440 690 400 L 640 290 C 620 250 630 200 670 170 C 700 140 680 90 630 90 L 480 90 C 430 90 400 130 410 170 L 430 240 C 440 290 400 330 350 340 L 240 360 C 190 370 160 420 190 460 C 220 490 270 480 320 480 L 380 480 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 4: Accent DRS / Flow Highlights -->
  <path
    class="track-accent"
    d="M 380 480 L 640 480 C 680 480 710 440 690 400 L 640 290 C 620 250 630 200 670 170 C 700 140 680 90 630 90 L 480 90 C 430 90 400 130 410 170 L 430 240 C 440 290 400 330 350 340 L 240 360 C 190 370 160 420 190 460 C 220 490 270 480 320 480 L 380 480 Z"
    fill="none"
    stroke="#ff3b30"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="16 120"
  />
  <!-- Layer 5: Start / Finish Line Marker -->
  <circle
    class="track-start"
    cx="380"
    cy="480"
    r="7"
    fill="#ff3b30"
    stroke="#ffffff"
    stroke-width="2.5"
  />
</svg>
