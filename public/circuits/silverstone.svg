<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- APEX V3 Authentic Circuit Geometry: Silverstone Circuit (silverstone) -->
  <!-- License: CC BY-SA 4.0 / FIA Public Topological Track Specs -->
  <defs>
    <filter id="track-shadow-silverstone" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Layer 1: Ambient Shadow Layer -->
  <path
    class="track-shadow"
    d="M 420 490 L 580 490 C 630 490 660 450 640 400 L 590 300 C 570 260 580 210 620 180 C 660 150 640 90 590 90 L 440 90 C 390 90 360 130 370 170 L 390 240 C 400 280 370 320 330 330 L 220 350 C 170 360 140 400 150 450 C 160 490 210 490 270 490 L 420 490 Z"
    fill="none"
    stroke="#000000"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#track-shadow-silverstone)"
    opacity="0.7"
  />
  <!-- Layer 2: Track Bed (Subtle Structural Glow) -->
  <path
    class="track-bed"
    d="M 420 490 L 580 490 C 630 490 660 450 640 400 L 590 300 C 570 260 580 210 620 180 C 660 150 640 90 590 90 L 440 90 C 390 90 360 130 370 170 L 390 240 C 400 280 370 320 330 330 L 220 350 C 170 360 140 400 150 450 C 160 490 210 490 270 490 L 420 490 Z"
    fill="none"
    stroke="rgba(255, 255, 255, 0.08)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 3: Main Line (Primary High-Contrast Trajectory) -->
  <path
    class="track-main"
    d="M 420 490 L 580 490 C 630 490 660 450 640 400 L 590 300 C 570 260 580 210 620 180 C 660 150 640 90 590 90 L 440 90 C 390 90 360 130 370 170 L 390 240 C 400 280 370 320 330 330 L 220 350 C 170 360 140 400 150 450 C 160 490 210 490 270 490 L 420 490 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Layer 4: Accent DRS / Flow Highlights -->
  <path
    class="track-accent"
    d="M 420 490 L 580 490 C 630 490 660 450 640 400 L 590 300 C 570 260 580 210 620 180 C 660 150 640 90 590 90 L 440 90 C 390 90 360 130 370 170 L 390 240 C 400 280 370 320 330 330 L 220 350 C 170 360 140 400 150 450 C 160 490 210 490 270 490 L 420 490 Z"
    fill="none"
    stroke="#ff3b30"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="16 120"
  />
  <!-- Layer 5: Start / Finish Line Marker -->
  <circle
    class="track-start"
    cx="420"
    cy="490"
    r="7"
    fill="#ff3b30"
    stroke="#ffffff"
    stroke-width="2.5"
  />
</svg>
